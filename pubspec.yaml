name: haven
description: "Haven - Your private digital home for two. A production-quality couples application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Backend & Realtime
  supabase_flutter: ^2.3.4
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # WebRTC & Media Calling
  flutter_webrtc: ^1.6.0
  
  # Security, Biometrics & Cryptography
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  cryptography: ^2.7.1
  
  # UI, Icons, Animations & Typography
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # Media & Hardware
  image_picker: ^1.0.7
  record: ^7.1.1
  audioplayers: ^5.2.1
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  share_plus: ^7.2.2
  
  # Helpers
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mocktail: ^1.0.3
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
